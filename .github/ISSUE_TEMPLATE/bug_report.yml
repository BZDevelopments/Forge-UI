name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - core
        - data-table
        - command-palette
        - file-uploader
        - form
        - combobox
        - multi-select
        - date-range-picker
        - notifications
        - activity-timeline
        - kanban-board
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A link to a minimal reproduction (StackBlitz, CodeSandbox, or a repo) is the most useful thing you can give us.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Safari 17 on macOS 14
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology
      description: Only for accessibility problems, for example VoiceOver, NVDA with Firefox, or keyboard only.
