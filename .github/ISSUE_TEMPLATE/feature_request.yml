name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. The best solution is not always the one you had in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
