<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Forge UI: production-ready, accessible React components for the parts of modern applications developers hate building. Created by BZDevelopments."
    />
    <meta name="author" content="BZDevelopments" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Forge UI</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem("forge-docs-theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
